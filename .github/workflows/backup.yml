name: Sauvegarde quotidienne
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Outils PostgreSQL
        run: sudo apt-get install -y postgresql-client
      - name: Sauvegarde et envoi dans un bucket privé
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          BACKUP_ENDPOINT: ${{ secrets.BACKUP_ENDPOINT }}
        run: |
          stamp=$(date -u +%Y%m%d-%H%M)
          pg_dump "$DATABASE_URL" -Fc --no-owner -f "cree-$stamp.dump"
          aws s3 cp "cree-$stamp.dump" "s3://$BACKUP_BUCKET/cree-$stamp.dump" --endpoint-url "$BACKUP_ENDPOINT"
