# Services de développement : PostgreSQL, stockage S3 (MinIO) et boîte mail de test (Mailpit).
# Les valeurs viennent du fichier .env (voir .env.example).
name: cree
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports: ['127.0.0.1:${POSTGRES_PORT:?}:5432']
    volumes: ['cree-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  # Image de développement uniquement (l'image officielle n'est plus publiée sur Docker Hub).
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:?}
    ports:
      - '127.0.0.1:${MINIO_PORT:?}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:?}:9001'
    volumes: ['cree-files:/bitnami/minio/data']

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:?}:1025'
      - '127.0.0.1:${MAILPIT_PORT:?}:8025'

volumes:
  cree-db:
  cree-files:
