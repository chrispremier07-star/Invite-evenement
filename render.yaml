# Modèle Render (Blueprint) : l'API seule, construite depuis le Dockerfile.
# Les secrets ne sont jamais dans le dépôt : ils se collent dans l'onglet Environment de Render (voir docs/DEPLOIEMENT-RENDER.md).
databases:
  - name: cree-db
    plan: free # la base gratuite de Render expire après 30 jours : passez à un plan payant avant de garder de vraies données.
    region: frankfurt
    databaseName: cree
    user: cree

services:
  - type: web
    name: cree-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free # « free » s'endort après 15 min d'inactivité (réveil ~30 s) : passez à « starter » dès les vrais clients.
    healthCheckPath: /health
    # Les adresses publiques sont déduites de celle que Render attribue au service (surchargeables dans l'onglet Environment).
    dockerCommand: sh -c 'export PUBLIC_URL="${PUBLIC_URL:-$RENDER_EXTERNAL_URL}" STUDIO_URL="${STUDIO_URL:-$RENDER_EXTERNAL_URL/studio/}" ALLOWED_ORIGINS="${ALLOWED_ORIGINS:-$RENDER_EXTERNAL_URL}"; exec node apps/api/dist/server.js'
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: HOST, value: 0.0.0.0 }
      - { key: TRUST_PROXY, value: 'true' }
      - { key: LOG_LEVEL, value: info }
      - { key: FORM_DIST_DIR, value: apps/form/dist }
      - { key: STUDIO_DIST_DIR, value: apps/studio/dist }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: IP_HASH_SECRET, generateValue: true }
      - { key: SESSION_DAYS, value: '30' }
      - { key: LOGIN_LINK_MINUTES, value: '15' }
      - { key: LOGIN_LINK_COOLDOWN_SECONDS, value: '60' }
      - { key: DEFAULT_RESPONSE_DELAY_HOURS, value: '48' }
      - { key: DEFAULT_RETENTION_DAYS, value: '730' }
      - { key: PURGE_DELAY_DAYS, value: '30' }
      - { key: POLICY_VERSION, value: '2026-11' }
      - { key: S3_REGION, value: auto }
      - { key: S3_FORCE_PATH_STYLE, value: 'false' }
      - { key: TURNSTILE_SCRIPT_URL, value: 'https://challenges.cloudflare.com/turnstile/v0/api.js' }
      - { key: TURNSTILE_VERIFY_URL, value: 'https://challenges.cloudflare.com/turnstile/v0/siteverify' }
      - { key: RATE_GLOBAL_PER_MINUTE, value: '300' }
      - { key: RATE_SUBMIT_PER_HOUR, value: '10' }
      - { key: RATE_UPLOAD_PER_HOUR, value: '60' }
      - { key: RATE_AUTH_PER_HOUR, value: '10' }
      - key: DATABASE_URL
        fromDatabase:
          name: cree-db
          property: connectionString
      # Les autres variables (ADMIN_EMAIL, VAPID_*, SMTP_URL, MAIL_FROM, S3_*, TURNSTILE_*, PRIVACY_*) sont collées en une fois
      # dans l'onglet Environment > « Add from .env » : voir docs/DEPLOIEMENT-RENDER.md.
