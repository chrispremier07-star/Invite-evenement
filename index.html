<style>
:root{
  --creme:#F4ECE0; --creme-2:#EADDCB; --brun:#3B2218; --brun-2:#5A3A2C;
  --terra:#B85A35; --terra-fonce:#A04A28; --terra-encre:#9A4524;
  --ease:cubic-bezier(.22,.61,.36,1);
  --script:"Pinyon Script",cursive; --titre:"Bodoni Moda",Georgia,serif;
  --capitale:"Cinzel",Georgia,serif; --texte:"Jost",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--creme);color:var(--brun);font:300 17px/1.65 var(--texte);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;height:100svh}
img{display:block;max-width:100%}
a{color:var(--terra-encre);text-decoration:none}
a:hover{color:var(--brun)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 30px;border-radius:999px;
  font:500 12px/1 var(--capitale);letter-spacing:.22em;text-transform:uppercase;transition:background .6s var(--ease),color .6s var(--ease),border-color .6s var(--ease),transform .6s var(--ease)}
.btn-fonce{background:var(--brun);color:var(--creme)}
.btn-fonce:hover{background:var(--terra-fonce);color:var(--creme)}
.btn-ligne{border:1px solid var(--terra-encre);color:var(--terra-encre)}
.btn-ligne:hover{background:var(--terra-encre);color:var(--creme)}
.btn-creme{background:var(--creme);color:var(--brun)}
.btn-creme:hover{background:#fff;color:var(--brun)}

/* ---------- Intro / enveloppe ---------- */
.intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  padding:24px;background:radial-gradient(120% 80% at 50% 40%,#F8F2E9 0%,var(--creme) 55%,var(--creme-2) 100%);
  transition:opacity 1.4s var(--ease),visibility 0s linear 1.4s}
.intro.leaving{opacity:0;visibility:hidden}
.intro-surtitre{font:500 11px/1 var(--capitale);letter-spacing:.32em;text-transform:uppercase;color:var(--terra-encre);transition:opacity .8s var(--ease)}
.env{position:relative;width:min(82vw,340px);aspect-ratio:3/2;margin-top:110px;perspective:1400px}
.env-back{position:absolute;inset:0;background:#9E4A2A;border-radius:6px;box-shadow:0 30px 60px -30px rgba(59,34,24,.55),0 8px 20px -10px rgba(59,34,24,.3)}
.env-carte{position:absolute;left:6%;right:6%;top:5%;bottom:6%;z-index:2;background:#FBF6EF;border-radius:3px;
  display:flex;flex-direction:column;align-items:center;padding-top:7%;gap:4px;text-align:center;box-shadow:0 2px 10px rgba(59,34,24,.12);
  transition:transform 1.6s var(--ease) 1.25s}
.env-carte::before{content:"";position:absolute;inset:8px;border:1px solid rgba(184,90,53,.35);border-radius:2px;pointer-events:none}
.carte-surtitre{font:500 9px/1 var(--capitale);letter-spacing:.3em;text-transform:uppercase;color:var(--terra-encre)}
.carte-noms{font:400 clamp(28px,8.5vw,38px)/1.2 var(--script);color:var(--brun);padding:0 12px}
.carte-date{font:400 10px/1 var(--capitale);letter-spacing:.24em;text-transform:uppercase;color:var(--brun-2)}
.env-poche{position:absolute;inset:0;z-index:3;border-radius:6px;overflow:hidden}
.env-poche::before{content:"";position:absolute;inset:0;background:var(--terra);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.env-poche::after{content:"";position:absolute;inset:0;background:#AD5431;clip-path:polygon(0 100%,50% 50%,100% 100%)}
.env-rabat{position:absolute;left:0;right:0;top:0;height:58%;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;
  filter:drop-shadow(0 3px 4px rgba(59,34,24,.25));transition:transform 1.1s cubic-bezier(.6,0,.3,1) .35s,z-index 0s linear .9s}
.env-rabat::before{content:"";position:absolute;inset:0;background:#C2633D;border-radius:6px 6px 0 0;clip-path:polygon(0 0,100% 0,50% 100%)}
.cachet{position:absolute;left:50%;top:58%;z-index:5;width:68px;height:68px;transform:translate(-50%,-50%);border-radius:50%;
  display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#7A3B26 0%,#5B2717 55%,#43190E 100%);
  box-shadow:0 0 0 3px #5B2717,0 0 0 4px rgba(67,25,14,.5),0 6px 12px rgba(40,15,8,.4),inset 0 2px 4px rgba(255,210,180,.18),inset 0 -3px 6px rgba(0,0,0,.3);
  transition:opacity .6s var(--ease),transform .6s var(--ease)}
.cachet::before{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid rgba(236,200,165,.35)}
.cachet span{font:500 15px/1 var(--capitale);letter-spacing:.06em;color:#E8C9A6;text-shadow:0 -1px 0 rgba(0,0,0,.35)}
.intro-btn{transition:opacity .8s var(--ease),transform .8s var(--ease),background .6s var(--ease)}
.intro.ouverture .cachet{opacity:0;transform:translate(-50%,-50%) scale(.85)}
.intro.ouverture .env-rabat{transform:rotateX(180deg);z-index:1}
.intro.ouverture .env-carte{transform:translateY(-62%)}
.intro.ouverture .intro-btn,.intro.ouverture .intro-surtitre{opacity:0;pointer-events:none}
.intro.ouverture .intro-btn{transform:translateY(8px)}

/* ---------- Site ---------- */
.site{opacity:0;transition:opacity 1.6s var(--ease)}
body.revele .site{opacity:1}
section{position:relative}
.bloc{padding:104px 24px;max-width:620px;margin:0 auto}
.entete{text-align:center;margin-bottom:56px}
.surtitre{display:block;font:500 11px/1 var(--capitale);letter-spacing:.32em;text-transform:uppercase;color:var(--terra-encre);margin-bottom:18px}
.titre{font:400 clamp(38px,10vw,56px)/1.08 var(--titre);letter-spacing:-.01em;text-wrap:balance}
.titre em{font-style:italic}
.ornement{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:24px}
.ornement i{display:block;width:44px;height:1px;background:rgba(154,69,36,.45)}
.ornement b{display:block;width:6px;height:6px;transform:rotate(45deg);border:1px solid var(--terra-encre)}

/* Mots */
.m{display:inline-block;opacity:0;transform:translateY(.45em);transition:opacity 1.2s var(--ease),transform 1.2s var(--ease)}
.mots-visibles .m{opacity:1;transform:none}
/* Apparition */
.apparait{opacity:0;transform:translateY(28px);transition:opacity 1.3s var(--ease),transform 1.3s var(--ease)}
.apparait.visible{opacity:1;transform:none}

/* ---------- Accueil ---------- */
.hero{min-height:100svh;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;color:var(--creme);text-align:center}
.hero-photo{position:absolute;inset:-6% 0;background:var(--brun-2)}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;transform:scale(1.1);transition:transform 7s cubic-bezier(.2,.6,.2,1)}
body.revele .hero-photo img{transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,24,16,.12) 0%,rgba(43,24,16,0) 38%,rgba(43,24,16,.45) 58%,rgba(36,20,13,.82) 80%,rgba(36,20,13,.9) 100%)}
.hero-contenu{position:relative;z-index:1;width:100%;max-width:560px;padding:0 24px calc(34px + env(safe-area-inset-bottom))}
.hero .surtitre{color:#EBCDB0}
.hero .surtitre{margin-bottom:6px;font-size:10px}
.hero-noms{font:400 clamp(44px,13vw,76px)/1.05 var(--script);display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;column-gap:.25em;margin:0 0 8px}
.hero-noms .et{font-size:.55em;color:#E6BF9B}
.hero-date{font:400 12px/1.3 var(--capitale);letter-spacing:.26em;text-transform:uppercase;margin-bottom:14px}
.hero-phrase{font-size:14.5px;line-height:1.55;max-width:34ch;margin:0 auto 22px;color:rgba(244,236,224,.92);text-wrap:pretty}
.compteur{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(244,236,224,.3);border-bottom:1px solid rgba(244,236,224,.3)}
.compteur div{padding:11px 4px 10px;display:flex;flex-direction:column;gap:6px}
.compteur div+div{border-left:1px solid rgba(244,236,224,.2)}
.compteur strong{font:400 clamp(24px,7vw,32px)/1 var(--titre);font-variant-numeric:tabular-nums}
.compteur small{font:500 9px/1 var(--capitale);letter-spacing:.22em;text-transform:uppercase;color:rgba(244,236,224,.8)}
.jourj{font:italic 400 26px/1.2 var(--titre);padding:20px 0}
.hero-anim{opacity:0;transform:translateY(20px);transition:opacity 1.4s var(--ease),transform 1.4s var(--ease)}
body.revele .hero-anim{opacity:1;transform:none}

/* ---------- Guide de défilement d'accueil ---------- */
.defiler-guide{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin:20px auto 0;
  padding:8px 20px 9px;
  border-radius:999px;
  background:rgba(40,6,10,.34);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(224,191,126,.38);
  box-shadow:0 4px 18px rgba(26,3,6,.35), inset 0 1px 1px rgba(255,245,220,.22);
  color:rgba(246,241,231,.92);
  text-decoration:none;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  will-change:opacity,transform;
  transition:opacity 1.4s var(--ease), transform 1.4s var(--ease), background .4s var(--ease), border-color .4s var(--ease), box-shadow .4s var(--ease);
}
.defiler-guide:hover{
  background:rgba(55,10,18,.55);
  border-color:rgba(224,191,126,.65);
  box-shadow:0 6px 22px rgba(26,3,6,.45), 0 0 12px rgba(224,191,126,.25), inset 0 1px 1px rgba(255,245,220,.3);
  color:#fff;
}
.defiler-guide-texte{
  font:500 10.5px/1 var(--capitale);
  letter-spacing:.24em;
  text-transform:uppercase;
  color:#F6F1E7;
  text-shadow:0 1px 3px rgba(0,0,0,.5);
}
.defiler-guide-chevron{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#E0BF7E;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));
  animation:rebondDefiler 2.4s cubic-bezier(.45,0,.55,1) infinite;
}
.defiler-guide-chevron svg{
  width:16px;
  height:16px;
  display:block;
}
@keyframes rebondDefiler{
  0%, 100%{ transform:translateY(0); opacity:.8; }
  50%{ transform:translateY(5px); opacity:1; filter:drop-shadow(0 2px 5px rgba(224,191,126,.5)); }
}

@media (max-width:480px){
  .hero-contenu{padding:0 16px calc(24px + env(safe-area-inset-bottom))}
  .defiler-guide{
    margin-top:14px;
    padding:6px 14px 7px;
    gap:4px;
    max-width:calc(100% - 110px);
  }
  .defiler-guide-texte{
    font-size:9px;
    letter-spacing:.18em;
  }
  .defiler-guide-chevron svg{
    width:13px;
    height:13px;
  }
}

@media (max-height:640px){
  .hero-phrase{display:none}
  .hero-contenu{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .defiler-guide{
    margin-top:10px;
    padding:5px 12px 6px;
    gap:4px;
  }
  .defiler-guide-texte{
    font-size:8.5px;
    letter-spacing:.18em;
  }
}
.son{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(244,236,224,.92);color:var(--brun);box-shadow:0 4px 16px rgba(59,34,24,.25);opacity:0;pointer-events:none;transition:opacity 1.4s var(--ease) 1s}
body.revele .son.ok{opacity:1;pointer-events:auto}
.son svg{width:22px;height:22px}
.son .coupe{display:none}
.son.muet .coupe{display:block}.son.muet .onde{display:none}
/* ---------- Histoire ---------- */
.frise{position:relative;padding-left:52px}
.frise-ligne{position:absolute;left:15px;top:8px;bottom:8px;width:1px;background:rgba(59,34,24,.14)}
.frise-ligne i{position:absolute;inset:0;background:var(--terra);transform-origin:50% 0;transform:scaleY(0)}
.etape{position:relative;padding-bottom:56px}
.etape:last-child{padding-bottom:0}
.etape::before{content:"";position:absolute;left:-43px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--creme);border:1px solid var(--terra);transition:background 1s var(--ease) .3s,box-shadow 1s var(--ease) .3s}
.etape.visible::before{background:var(--terra);box-shadow:0 0 0 6px rgba(184,90,53,.12)}
.etape-date{font:500 11px/1 var(--capitale);letter-spacing:.26em;text-transform:uppercase;color:var(--terra-encre);margin-bottom:12px}
.etape h3{font:italic 400 28px/1.15 var(--titre);margin-bottom:10px}
.etape p{color:var(--brun-2);text-wrap:pretty}

/* ---------- Galerie ---------- */
.galerie{background:var(--creme-2)}
.galerie .bloc{max-width:900px}
.g-grille{display:flex;flex-direction:column;gap:26px}
.g-colonnes{display:grid;grid-template-columns:1fr 1fr;gap:26px 18px;align-items:start}
.g-col{display:flex;flex-direction:column;gap:26px}
.g-col:nth-child(2){padding-top:64px}
.g-enc{--h:0;--s:0;position:relative;padding:0;border-radius:4px;will-change:transform;
  -webkit-tap-highlight-color:transparent;filter:drop-shadow(0 0 calc(6px + 18px*var(--h)) rgba(236,196,110,calc(.06 + .3*var(--h)))) drop-shadow(0 2px 4px rgba(59,34,24,.1))}
.g-or{position:relative;padding:0}
.g-pass{position:relative;padding:0}
.g-pass .g-cadre{z-index:1;box-shadow:0 0 0 1px rgba(176,134,52,.85),0 0 0 3px #F8F0E0,0 0 0 4px rgba(176,134,52,.55)}
.g-o1,.g-o2{position:absolute;inset:-9px;z-index:4;pointer-events:none}.g-o2{transform:rotate(180deg)}
.g-o1 svg,.g-o2 svg{position:absolute;right:-3px;top:-3px;width:59px;height:59px;overflow:visible;filter:drop-shadow(0 1px 1px rgba(60,35,5,.35))}
.g-fil{position:absolute;background:linear-gradient(90deg,#7A5518,#E8C879 22%,#FFF3C8 34%,#B58A38 50%,#7A5518 70%,#E8C879 88%,#8F6A20);background-size:300% 100%;background-position:calc(50% + var(--s,0)*50%) 0}
.g-fil.h{right:34px;top:3px;width:62%;height:2.5px;clip-path:polygon(0 50%,100% 0,100% 100%)}
.g-fil.h2{right:38px;top:8px;width:36%;height:1.5px;clip-path:polygon(0 50%,100% 0,100% 100%)}
.g-fil.v{right:3px;top:34px;height:56%;width:2.5px;clip-path:polygon(0 0,100% 0,50% 100%);background-size:100% 300%;background-position:0 calc(50% + var(--s,0)*50%)}
.g-fil.v2{right:8px;top:38px;height:32%;width:1.5px;clip-path:polygon(0 0,100% 0,50% 100%);background-size:100% 300%;background-position:0 calc(50% + var(--s,0)*50%)}
.g-lueur{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:soft-light;
  background:linear-gradient(105deg,transparent 30%,rgba(255,244,214,.0) 38%,rgba(255,248,226,.95) 50%,rgba(255,244,214,0) 62%,transparent 70%);
  background-size:300% 100%;background-position:calc(50% - var(--s)*55%) 0;opacity:.85}
.g-cadre{position:relative;overflow:hidden;border-radius:1px;aspect-ratio:4/5;background:#D9C8B2}
.g-cadre.large{aspect-ratio:4/3}
.g-cadre img{position:absolute;left:0;top:-12%;width:100%;height:124%;object-fit:cover;will-change:transform}

/* ---------- Programme ---------- */
.programme-liste{list-style:none;border-top:1px solid rgba(59,34,24,.14)}
.programme-liste li{display:grid;grid-template-columns:84px 1fr;gap:16px;padding:26px 0;border-bottom:1px solid rgba(59,34,24,.14)}
.p-heure{font:italic 400 24px/1.2 var(--titre);color:var(--terra-encre)}
.p-titre{font:500 13px/1.4 var(--capitale);letter-spacing:.18em;text-transform:uppercase;margin:4px 0 6px}
.p-texte{color:var(--brun-2);font-size:16px}

/* ---------- Lieu ---------- */
.lieu{text-align:center}
.lieu-nom{font:400 30px/1.2 var(--titre);margin-bottom:10px}
.lieu-adresse{color:var(--brun-2);margin-bottom:32px}
.carte{width:100%;height:320px;border:0;border-radius:2px;display:block;filter:grayscale(.35) sepia(.18);background:var(--creme-2);margin-bottom:32px}

/* ---------- Tenue ---------- */
.tenue{text-align:center;padding-top:0}
.tenue-texte{max-width:36ch;margin:0 auto 44px;color:var(--brun-2);text-wrap:pretty}
.pastilles{display:flex;justify-content:center;gap:32px}
.pastille{display:flex;flex-direction:column;align-items:center;gap:14px}
.pastille i{display:block;width:64px;height:64px;border-radius:50%;box-shadow:0 0 0 1px rgba(59,34,24,.12),0 0 0 6px var(--creme),0 0 0 7px rgba(59,34,24,.12)}
.pastille span{font:500 10px/1 var(--capitale);letter-spacing:.22em;text-transform:uppercase}

/* ---------- RSVP ---------- */
.rsvp{background:var(--brun);color:var(--creme);text-align:center}
.rsvp .surtitre{color:#E6BF9B}
.rsvp .ornement i{background:rgba(230,191,155,.5)}.rsvp .ornement b{border-color:#E6BF9B}
.rsvp-texte{max-width:36ch;margin:0 auto 36px;color:rgba(244,236,224,.85);text-wrap:pretty}
.rsvp-avant{font:500 11px/1 var(--capitale);letter-spacing:.26em;text-transform:uppercase;color:#E6BF9B;margin-bottom:10px}
.rsvp-date{font:italic 400 30px/1.2 var(--titre);margin-bottom:40px}

/* ---------- Pied de page ---------- */
.pied{text-align:center;padding:96px 24px calc(64px + env(safe-area-inset-bottom))}
.pied-merci{font:italic 400 clamp(26px,7vw,34px)/1.25 var(--titre);max-width:16ch;margin:0 auto 28px;text-wrap:balance}
.pied-initiales{font:400 72px/1 var(--script);color:var(--terra);margin-bottom:22px}
.pied-hashtag{font:500 12px/1 var(--capitale);letter-spacing:.24em;color:var(--terra-encre)}

@media (min-width:760px){
  .bloc{padding:140px 32px}
  .g-colonnes{gap:20px}.g-col{gap:20px}.g-grille{gap:20px}
  .g-col:nth-child(2){padding-top:120px}
  .carte{height:380px}
}

/* ---------- Moins de mouvement ---------- */
@media (prefers-reduced-motion:reduce){

  .defiler-guide-chevron{animation:none!important}
}

<script>
(function(){
  const C = INVITATION, $ = id => document.getElementById(id);

  $('heroPhrase').textContent = C.accueil.phrase;
  if ($('defilerTexte') && C.accueil && C.accueil.defiler) $('defilerTexte').textContent = C.accueil.defiler;
  const guide = $('defilerGuide');
  if (guide){
    guide.addEventListener('click', e => {
      e.preventDefault();
      const cible = $('histoire');
      if (cible) cible.scrollIntoView({ behavior: 'smooth' });
    });
  }

  // Compte à rebours
  let cible = new Date(String(C.dateMariage).trim().replace(' ','T')).getTime();
  if (isNaN(cible)) { const m = String(C.dateMariage).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})(?:\D+(\d{1,2})\D+(\d{1,2}))?/); cible = m ? new Date(+m[1], m[2]-1, +m[3], +(m[4]||0), +(m[5]||0)).getTime() : Date.now(); }
  $('compteur').innerHTML = C.accueil.compteur.map(l => '<div><strong>00</strong><small>'+esc(l)+'</small></div>').join('');
  const nums = $('compteur').querySelectorAll('strong');
  function tic(){
    let d = Math.max(0, cible - Date.now());
    if (d === 0){ $('compteur').outerHTML = '<p class="jourj">'+esc(C.accueil.jourj)+'</p>'; return; }

  // Histoire
  $('frise').insertAdjacentHTML('beforeend', C.histoire.etapes.map(e =>
    '<div class="etape apparait"><p class="etape-date">'+esc(e.date)+'</p><h3>'+esc(e.titre)+'</h3><p>'+esc(e.texte)+'</p></div>').join(''));

  // Galerie
  const ph = C.galerie.photos, prof = [0, 18, -14, 26, -10, 20];
  const coins = '<div class="g-o1"><svg viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="gld" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1C2"/><stop offset=".45" stop-color="#D2A74F"/><stop offset=".75" stop-color="#F3DC96"/><stop offset="1" stop-color="#8A6420"/></linearGradient></defs><g stroke="url(#gld)" stroke-width="2.4"><path d="M62 10C52 0 38 4 43 13C47 18 55 15 52 10"/><path d="M57 6C65 1 75 3 81 10" stroke-width="3.2"/></g><g transform="matrix(0 -1 -1 0 100 100)" stroke="url(#gld)" stroke-width="2.4"><path d="M62 10C52 0 38 4 43 13C47 18 55 15 52 10"/><path d="M57 6C65 1 75 3 81 10" stroke-width="3.2"/></g><path d="M100 0L86 4C90 6 93 9 96 14C97 9 98 5 100 0Z" fill="url(#gld)" stroke="#7A5518" stroke-width=".5"/><g transform="translate(74 26) rotate(45) scale(1.2)" fill="url(#gld)" stroke="#7A5518" stroke-width=".5"><path d="M0-17C5-10 5-3 0 4C-5-3-5-10 0-17Z"/><path d="M-1 2C-6-8-17-9-16-1C-15 4-8 6-5 3Z"/><path d="M1 2C6-8 17-9 16-1C15 4 8 6 5 3Z"/><rect x="-6" y="3" width="12" height="2.6" rx="1"/><path d="M0 5.6C-3 10-2 13 0 16C2 13 3 10 0 5.6Z"/></g><circle cx="49" cy="10" r="1.6" fill="url(#gld)"/><circle cx="90" cy="51" r="1.6" fill="url(#gld)"/></svg><i class="g-fil h"></i><i class="g-fil h2"></i><i class="g-fil v"></i><i class="g-fil v2"></i></div><div class="g-o2"><svg viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="gld" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1C2"/><stop offset=".45" stop-color="#D2A74F"/><stop offset=".75" stop-color="#F3DC96"/><stop offset="1" stop-color="#8A6420"/></linearGradient></defs><g stroke="url(#gld)" stroke-width="2.4"><path d="M62 10C52 0 38 4 43 13C47 18 55 15 52 10"/><path d="M57 6C65 1 75 3 81 10" stroke-width="3.2"/></g><g transform="matrix(0 -1 -1 0 100 100)" stroke="url(#gld)" stroke-width="2.4"><path d="M62 10C52 0 38 4 43 13C47 18 55 15 52 10"/><path d="M57 6C65 1 75 3 81 10" stroke-width="3.2"/></g><path d="M100 0L86 4C90 6 93 9 96 14C97 9 98 5 100 0Z" fill="url(#gld)" stroke="#7A5518" stroke-width=".5"/><g transform="translate(74 26) rotate(45) scale(1.2)" fill="url(#gld)" stroke="#7A5518" stroke-width=".5"><path d="M0-17C5-10 5-3 0 4C-5-3-5-10 0-17Z"/><path d="M-1 2C-6-8-17-9-16-1C-15 4-8 6-5 3Z"/><path d="M1 2C6-8 17-9 16-1C15 4 8 6 5 3Z"/><rect x="-6" y="3" width="12" height="2.6" rx="1"/><path d="M0 5.6C-3 10-2 13 0 16C2 13 3 10 0 5.6Z"/></g><circle cx="49" cy="10" r="1.6" fill="url(#gld)"/><circle cx="90" cy="51" r="1.6" fill="url(#gld)"/></svg><i class="g-fil h"></i><i class="g-fil h2"></i><i class="g-fil v"></i><i class="g-fil v2"></i></div>';
  const cadre = (src,i,large) => '<div class="apparait"><div class="g-enc" data-prof="'+prof[i%prof.length]+'"><div class="g-or"><div class="g-pass"><div class="g-cadre'+(large?' large':'')+'"><img src="'+esc(src)+'" alt="" loading="lazy" decoding="async"><i class="g-lueur"></i></div></div></div>'+coins+'</div></div>';
  let g = ph.length ? cadre(ph[0],0,true) : '';
  const reste = ph.slice(1), gauche = [], droite = [];
  reste.forEach((s,i)=> (i%2 ? droite : gauche).push(cadre(s,i+1)));
  if (reste.length) g += '<div class="g-colonnes"><div class="g-col">'+gauche.join('')+'</div><div class="g-col">'+droite.join('')+'</div></div>';
  $('grille').innerHTML = g;

  // Programme
  $('programmeListe').innerHTML = C.programme.moments.map(m =>
    '<li class="apparait"><span class="p-heure">'+esc(m.heure)+'</span><div><p class="p-titre">'+esc(m.titre)+'</p><p class="p-texte">'+esc(m.texte)+'</p></div></li>').join('');

  // Lieu
  const adresseComplete = C.lieu.nom + ', ' + C.lieu.adresse + ', ' + C.lieu.ville;
  $('lieuAdresse').innerHTML = esc(C.lieu.adresse) + '<br>' + esc(C.lieu.ville);
  $('carte').src = C.lieu.carteIntegree || ('https://maps.google.com/maps?q=' + encodeURIComponent(adresseComplete) + '&z=15&hl=fr&output=embed');
  $('itineraire').href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(adresseComplete);
  $('itineraire').textContent = C.lieu.bouton;

  // Tenue
  $('pastilles').innerHTML = C.tenue.couleurs.map((c,i) =>
    '<div class="pastille apparait" style="transition-delay:'+(i*.15)+'s"><i style="background:'+esc(c.code)+'"></i><span>'+esc(c.nom)+'</span></div>').join('');

  // RSVP + pied
  $('rsvpLien').href = C.rsvp.lien; $('rsvpLien').textContent = C.rsvp.bouton;
  $('piedInitiales').textContent = i1 + ' & ' + i2;

  // Titres mot par mot
  document.querySelectorAll('.mots').forEach(el => {
    el.innerHTML = el.textContent.trim().split(/\s+/).map((w,i) =>
      '<span class="m" style="transition-delay:'+(i*.12)+'s">'+esc(w)+'</span>').join(' ');
  });

  // Musique
  const audio = $('audio'), son = $('son');
  let voulu = false;
  if (C.musique){ audio.src = C.musique; audio.addEventListener('error', () => son.classList.remove('ok')); son.classList.add('ok'); }

  document.addEventListener('visibilitychange', () => { if (!C.musique) return; if (document.hidden) audio.pause(); else if (voulu) audio.play().catch(()=>{}); });

  // Confettis et particules
  function fete(){
    const cv = $('fete'), x = cv.getContext('2d'), hero = $('accueil');
    let W, H, dpr, items = [], vu = true, t0 = performance.now();
    const pal = ['#E9D3A5','#F4ECE0','#D9B97A','#EBC9B8','#E3A98F','#F7E6C4'];
    const R = (a,b) => a + Math.random()*(b-a);
    function taille(){ dpr = Math.min(devicePixelRatio||1, 2); W = hero.clientWidth; H = hero.clientHeight; cv.width = W*dpr; cv.height = H*dpr; x.setTransform(dpr,0,0,dpr,0,0); }

        s: conf ? R(4,8)*z+2 : R(.8,2.2)*z+.4, rot: R(0,6.28), vr: R(-.5,.5), forme: Math.floor(R(0,3)), c: pal[Math.floor(R(0,pal.length))],
        tw: R(.5,1.6), max: conf ? R(.4,.7) : R(.5,.9) };
    }
    function init(){ taille(); const n = W < 600 ? 14 : 22, m = W < 600 ? 22 : 34; items = []; for (let i=0;i<n+m;i++) items.push(neuf(i, true)); }
    function dessiner(t, dt){
      x.clearRect(0,0,W,H);
      for (const p of items){

        // fondu entrée/sortie, scintillement, zone du visage épargnée

        const fx = p.x > .22 && p.x < .78 && p.y > .05 && p.y < .55; if (fx) a *= .18;

        x.globalAlpha = a; x.fillStyle = p.c;
        if (p.conf){
          x.save(); x.translate(px,py); x.rotate(p.rot + t*p.vr);

          if (p.forme === 0) x.fillRect(-p.s/2, -p.s/3, p.s, p.s*.66);
          else if (p.forme === 1){ x.beginPath(); x.arc(0,0,p.s/2.4,0,6.283); x.fill(); }
          else { x.beginPath(); x.ellipse(0,0,p.s/1.6,p.s/3.4,0,0,6.283); x.fill(); }
          x.restore();
        } else {
          x.shadowColor = p.c; x.shadowBlur = p.s*3; x.beginPath(); x.arc(px,py,p.s,0,6.283); x.fill(); x.shadowBlur = 0;
        }
      }
      x.globalAlpha = 1;
    }
    init(); cv.style.opacity = 1;
    if (calme){ dessiner(3, 0); return; }
    let dern = performance.now();
    function boucle(now){
      requestAnimationFrame(boucle);
      if (!vu || document.hidden){ dern = now; return; }
      const dt = Math.min(.05, (now - dern)/1000); dern = now;
      dessiner((now - t0)/1000, dt);
    }
    requestAnimationFrame(boucle);
    if ('IntersectionObserver' in window) new IntersectionObserver(e => vu = e[0].isIntersecting).observe(hero);
    let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(init, 250); });
  }

  // Ouverture
  let ouvert = false;
  function demarrer(){
    document.body.classList.remove('locked');
    document.body.classList.add('revele');
    $('site').removeAttribute('aria-hidden');
    $('heroNoms').classList.add('mots-visibles');
    observer();
    fete();
    if (!calme){ addEventListener('scroll', planifier, {passive:true}); addEventListener('resize', planifier); planifier(); }
    else { addEventListener('scroll', majGuide, {passive:true}); }
  }
  $('ouvrir').addEventListener('click', () => {
    if (ouvert) return; ouvert = true;
    if (C.musique) jouer();
    const intro = $('intro');
    if (calme){ intro.remove(); demarrer(); return; }
    intro.classList.add('ouverture');
    setTimeout(() => { intro.classList.add('leaving'); demarrer(); }, 3100);
    setTimeout(() => intro.remove(), 4600);
  });

  // Apparitions
  function observer(){
    const els = document.querySelectorAll('.apparait, .mots');
    if (!('IntersectionObserver' in window) || calme){ els.forEach(e => e.classList.add('visible','mots-visibles')); return; }
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (en.isIntersecting){ en.target.classList.add('visible','mots-visibles'); io.unobserve(en.target); }
    }), {threshold:.15, rootMargin:'0px 0px -6% 0px'});
    els.forEach(e => io.observe(e));
  }

  function majGuide(){
    if (!guide) return;
    const sc = scrollY;
    if (sc <= 0){
      guide.style.opacity = '';
      guide.style.transform = '';
      guide.style.pointerEvents = '';
    } else {
      const op = Math.max(0, 1 - sc / 70);
      guide.style.opacity = op.toFixed(3);
      guide.style.transform = 'translate3d(0,' + (sc * 0.35).toFixed(1) + 'px,0)';
      guide.style.pointerEvents = op < 0.05 ? 'none' : 'auto';
    }
  }

  // Frise + profondeur au défilement
  let attente = false;
  const remplie = $('friseRemplie'), frise = $('frise');
  const cadres = [...document.querySelectorAll('.g-enc')], photoHero = $('heroPhoto');
  function planifier(){ if (!attente){ attente = true; requestAnimationFrame(maj); } }
  function maj(){
    attente = false;
    majGuide();
    const vh = innerHeight;
    const r = frise.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (vh*.72 - r.top) / r.height));
    remplie.style.transform = 'scaleY(' + p.toFixed(4) + ')';
    if (scrollY < vh) photoHero.style.transform = 'translate3d(0,' + (scrollY*.25).toFixed(1) + 'px,0)';
    cadres.forEach(c => {
      const b = c.getBoundingClientRect();
      if (b.bottom < -100 || b.top > vh + 100) return;
      const k = (b.top + b.height/2 - vh/2) / vh;
      c.style.transform = 'translate3d(0,' + (k * +c.dataset.prof).toFixed(1) + 'px,0)';
      c.querySelector('img').style.transform = 'translate3d(0,' + (k * -34).toFixed(1) + 'px,0)';
      c.style.setProperty('--s', Math.max(-1, Math.min(1, k * 1.8)).toFixed(3));
      c.style.setProperty('--h', Math.max(0, 1 - Math.abs(k) * 2.4).toFixed(3));
    });
  }
})();
